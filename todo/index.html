<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jatin's React Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="todo-shell">
    <header class="todo-header">
      <div>
        <p class="eyebrow">ai.jatinkaushik.com</p>
        <h1>Todo Flow</h1>
        <p class="lede">Fast, clean, and local-first. Your tasks stay in this browser only.</p>
      </div>
      <div class="status-pill">React · Local</div>
    </header>

    <div id="root"></div>
  </div>
  <footer class="todo-footer">
    <p>Tip: Everything is stored in browser memory only. Clear the cache to reset.</p>
  </footer>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
