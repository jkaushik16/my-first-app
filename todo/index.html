<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jatin's React Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="todo-shell">
    <header class="todo-header">
      <div>
        <p class="eyebrow">ai.jatinkaushik.com</p>
        <h1>Daily Flow</h1>
        <p class="lede">Todos, done the React way. Everything stays in this browser via <abbr title="browser local storage">localStorage</abbr>, so your notes feel instant.</p>
      </div>
      <div class="status-pill">React · Local</div>
    </header>

    <div id="root"></div>
  </div>
  <footer class="todo-footer">
    <p>Tip: Everything is stored in browser memory only. Clear the cache to reset.</p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
