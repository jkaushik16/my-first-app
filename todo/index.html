<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simple LocalStorage Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-shell">
    <h1>To-do list</h1>
    <form id="todo-form">
      <input id="todo-input" name="todo" autocomplete="off" maxlength="100" placeholder="Add a task" required />
      <button type="submit">Add</button>
    </form>
    <ul id="todo-list" aria-live="polite"></ul>
    <div class="cta">
      <p>All tasks stay only in this browser (localStorage). Reload to continue editing.</p>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
